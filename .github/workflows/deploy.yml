name: CI/CD Pipeline - DevOps Cloud Project

on:
  push:
    branches: [ "main" ]

jobs:
  # ---- FASE DE INTEGRACIÓN CONTINUA (CI) ----
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - name: Clonar el repositorio
      uses: actions/checkout@v3

    - name: Inicializar Node.js (Entorno de pruebas)
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    - name: Instalar Dependencias y Simular Pruebas Unitarias
      run: |
        npm install express redis
        echo "Running basic syntax check..."
        node -c app.js
        echo "✅ Pruebas básicas aprobadas con éxito."

  # ---- FASE DE DESPLIEGUE CONTINUO (CD) ----
  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
    - name: Clonar el repositorio para el deploy
      uses: actions/checkout@v3

    - name: Desplegar en la VM de GCP vía SSH
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SSH_HOST }}
        username: 'bsujuyh'
        key: ${{ secrets.SSH_KEY }}
        port: 22
        script: |
          mkdir -p ~/app
          cd ~/app
          
          # Limpiar contenedores viejos si existen
          docker compose down || true
          
          # Clonar o actualizar el repositorio directamente en la VM para evitar errores de cat
          if [ ! -d ".git" ]; then
            git clone https://github.com/${{ github.repository }}.git .
          else
            git pull origin main
          fi
          
          # Levantar los servicios de inmediato
          docker compose up -d --build
          
          echo "🚀 ¡Despliegue completado en Producción!"
